server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Тело запроса с вложениями: 5 файлов по 10 МБ + накладные расходы multipart.
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # SPA: любой неизвестный путь отдаёт index.html — маршрут разбирает клиент,
    # а не сервер. Перезагрузки страницы при работе с задачами не происходит.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Файлы сборки Vite содержат хеш в имени — их можно кешировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API живёт за тем же origin, поэтому CORS не нужен.
    location /api {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Загрузку файлов передаём потоком, не накапливая целиком в nginx.
        proxy_request_buffering off;
    }
}
