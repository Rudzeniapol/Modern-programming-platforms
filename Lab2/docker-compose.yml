# Три контейнера: база данных, REST API и SPA за nginx.
# Запуск: docker compose up --build  →  http://localhost:8088

name: spp-lab2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # API стартует только после того, как база начнёт принимать соединения.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks} -d ${POSTGRES_DB:-tasks}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:-tasks}@db:5432/${POSTGRES_DB:-tasks}
      UPLOADS_DIR: /app/uploads
    volumes:
      # Именованный том: загруженные файлы переживают пересборку образа.
      - uploads:/app/uploads
    ports:
      # Порт наружу нужен только чтобы дёргать API напрямую (curl, Postman).
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./client
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
