# Blueprint для Render (https://render.com) — развёртывание ЛР №4 «Пиксельная битва».
# Render → New → Blueprint → выбрать этот репозиторий: создаст веб-сервис из
# Lab4/Dockerfile и бесплатную базу PostgreSQL, свяжет их через DATABASE_URL.
# Порт Render передаёт сам в переменной PORT, WebSocket поддерживается на том же порту.

services:
  - type: web
    name: spp-pixel-battle
    runtime: docker
    plan: free
    dockerfilePath: ./Lab4/Dockerfile
    dockerContext: ./Lab4
    healthCheckPath: /api/health
    autoDeploy: true
    # Пересобирать только при изменениях в Lab4.
    buildFilter:
      paths:
        - Lab4/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spp-pixel-battle-db
          property: connectionString
      - key: ROUND_DURATION_SEC
        value: "600"

databases:
  - name: spp-pixel-battle-db
    plan: free
    databaseName: pixels
    user: pixels
